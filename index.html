<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="quiz">
    <h1>Quiz Game</h1>

    <!-- Shown while the quiz is running -->
    <section id="quiz-box">
      <p id="progress"></p>
      <h2 id="question"></h2>
      <div id="options"></div>
      <p id="feedback"></p>
      <button id="next-btn" disabled>Next question</button>
    </section>

    <!-- Shown when the quiz is finished -->
    <section id="result-box" class="hidden">
      <h2>Quiz finished</h2>
      <p id="final-score"></p>
      <button id="restart-btn">Play again</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
